name: Build

on:
  push:
    tags: ["v*"]        # push a tag like v1.0 to publish a release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          copy build\Release\flashcards.exe dist\
          windeployqt --release dist\flashcards.exe
          Compress-Archive dist\* Flashcards-Windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/flashcards.app
          # ad-hoc sign so macOS doesn't call the app "damaged"
          codesign --force --deep -s - build/flashcards.app
          mkdir dmg
          cp -R build/flashcards.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Flashcards -srcfolder dmg -ov -format UDZO Flashcards-macOS.dmg

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Flashcards-*
