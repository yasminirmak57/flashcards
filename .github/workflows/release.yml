name: Build

on:
  push:
    tags: ["v*"]        # push a tag like v1.0 to publish a release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"

      - name: Make icon from the lace photo
        run: |
          python3 -m pip install --quiet pillow || python -m pip install --quiet pillow
          python3 tools/make_icon.py --ico || python tools/make_icon.py --ico
        shell: bash

      - name: Make .icns (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir icon.iconset
          for s in 16 32 128 256; do
            sips -z $s $s icon/icon.png --out icon.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) icon/icon.png --out icon.iconset/icon_${s}x${s}@2x.png
          done
          cp icon/icon.png icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o icon/flashcards.icns

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          copy build\Release\flashcards.exe dist\
          windeployqt --release dist\flashcards.exe
          Compress-Archive dist\* Flashcards-Windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/flashcards.app
          # ad-hoc sign so macOS doesn't call the app "damaged"
          codesign --force --deep -s - build/flashcards.app
          mkdir dmg
          cp -R build/flashcards.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Flashcards -srcfolder dmg -ov -format UDZO Flashcards-macOS.dmg

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Flashcards-*
